[workspace]
members = ["crates/protocol", "crates/renderer-policy", "crates/renderer", "crates/native-encoder", "crates/gpu-pipeline"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "process", "rt-multi-thread", "time", "io-util", "io-std", "fs", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
