name: Native release dry run

on:
  workflow_dispatch:
    inputs:
      execute_native:
        description: Run configured native self-hosted validation jobs
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  foundation:
    name: Release foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up the workspace
        uses: ./.github/actions/setup
      - name: Verify release declarations
        run: pnpm release:verify
      - name: Check generated contracts
        run: pnpm contracts:check
      - name: Check TypeScript types
        run: pnpm check-types
      - name: Test build and release scripts
        run: pnpm test:scripts
      - name: Run package tests
        run: xvfb-run -a pnpm test --concurrency=1

  native:
    name: Windows release candidate
    if: inputs.execute_native
    needs: foundation
    runs-on: [self-hosted, velocast, windows, x64]
    timeout-minutes: 60
    env:
      VELOCAST_RELEASE_TARGET: win32-x64
      VELOCAST_RELEASE_MODE: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up the workspace
        uses: ./.github/actions/setup
      - name: Build and sign the renderer and stage the runtime
        run: node scripts/release/native-release-target.mjs build win32-x64
        env:
          VELOCAST_RELEASE_EVIDENCE: ${{ runner.temp }}/velocast-evidence
          VELOCAST_AUTHENTICODE_CERTIFICATE: ${{ secrets.VELOCAST_AUTHENTICODE_CERTIFICATE }}
          VELOCAST_AUTHENTICODE_PASSWORD: ${{ secrets.VELOCAST_AUTHENTICODE_PASSWORD }}
      - name: Package and verify the immutable artifact
        run: node scripts/release/native-release-target.mjs package win32-x64
        env:
          VELOCAST_RELEASE_EVIDENCE: ${{ runner.temp }}/velocast-evidence
      - name: Validate npm and pnpm external consumers
        run: node scripts/release/native-release-target.mjs validate win32-x64
        env:
          VELOCAST_RELEASE_EVIDENCE: ${{ runner.temp }}/velocast-evidence
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: velocast-win32-x64
          path: ${{ runner.temp }}/velocast-evidence
          if-no-files-found: error

  assemble:
    name: Assemble the dry-run manifest
    if: inputs.execute_native
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up the workspace
        uses: ./.github/actions/setup
        with:
          rust: "false"
      - name: Download release evidence
        uses: actions/download-artifact@v8
        with:
          name: velocast-win32-x64
          path: ${{ runner.temp }}/velocast-evidence
      - name: Assemble the selected target
        run: >-
          xvfb-run -a node scripts/release/assemble-release-manifest.mjs
          --target win32-x64
          --evidence-dir "${{ runner.temp }}/velocast-evidence"
          --output "${{ runner.temp }}/velocast-release-dry-run.json"
          --base-url https://artifacts.invalid/velocast/dry-run/
      - name: Upload the dry-run manifest
        uses: actions/upload-artifact@v7
        with:
          name: velocast-release-dry-run
          path: ${{ runner.temp }}/velocast-release-dry-run.json
          if-no-files-found: error
