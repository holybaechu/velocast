name: Electron renderer

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-webcodecs:
    name: Renderer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            capture: unavailable
            display: xvfb-run -a
          - os: windows-2022
            capture: unavailable
            display: ""
          - os: macos-15
            capture: required
            display: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up the workspace
        uses: ./.github/actions/setup
      - name: Build packages
        run: pnpm build
      - name: Test the native renderer
        run: cargo test -p velocast-renderer
      - name: Build the native renderer
        run: cargo build -p velocast-renderer
      - name: Configure renderer test paths (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          electron="$(node -p "require('./packages/electron-host/node_modules/electron')")"
          echo "VELOCAST_ELECTRON_TEST_BINARY=$electron" >> "$GITHUB_ENV"
          echo "VELOCAST_WEBCODECS_TEST_BINARY=$electron" >> "$GITHUB_ENV"
          echo "VELOCAST_TEST_RENDERER=$CARGO_TARGET_DIR/debug/velocast-renderer" >> "$GITHUB_ENV"
      - name: Configure renderer test paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $electron = node -p "require('./packages/electron-host/node_modules/electron')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VELOCAST_ELECTRON_TEST_BINARY=$electron" >> $env:GITHUB_ENV
          "VELOCAST_WEBCODECS_TEST_BINARY=$electron" >> $env:GITHUB_ENV
          "VELOCAST_TEST_RENDERER=$(Join-Path $env:CARGO_TARGET_DIR 'debug/velocast-renderer.exe')" >> $env:GITHUB_ENV
      - name: Verify the Electron capture host
        run: ${{ matrix.display }} node --test packages/electron-host/test/software-runtime.test.cjs packages/electron-host/test/shared-capability-runtime.test.cjs
      # Hosted Linux and Windows lack the required GPU compositor. Successful
      # shared-texture video remains mandatory on macOS and native release hosts.
      - name: Verify capture capability and frame output (Unix)
        if: runner.os != 'Windows'
        run: ${{ matrix.display }} node scripts/verify/verify-electron-portable.mjs --renderer "$VELOCAST_TEST_RENDERER" --output "$RUNNER_TEMP/electron-portable" --capture ${{ matrix.capture }} --frames 24 --repeats 2
      - name: Verify capture capability and frame output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: node scripts/verify/verify-electron-portable.mjs --renderer "$env:VELOCAST_TEST_RENDERER" --output "$env:RUNNER_TEMP/electron-portable" --capture unavailable --frames 8 --repeats 1
      - name: Verify video and native audio utilities
        run: ${{ matrix.display }} node --test packages/electron-host/test/native-media.integration.test.cjs
      - name: Verify media formats and audio (macOS)
        if: runner.os == 'macOS'
        run: node scripts/verify/verify-media-formats.mjs --renderer "$VELOCAST_TEST_RENDERER" --output "$RUNNER_TEMP/media-formats"
      - name: Verify shared-texture 4K capture (macOS)
        if: runner.os == 'macOS'
        run: node scripts/verify/verify-shared-texture-capture.mjs --renderer "$VELOCAST_TEST_RENDERER" --output "$RUNNER_TEMP/native-capture" --frames 24 --repeats 3 --mode both --all-frames true
      - name: Verify authored footage and audio (macOS)
        if: runner.os == 'macOS'
        run: node scripts/verify/verify-footage-native.mjs "$VELOCAST_TEST_RENDERER" "$RUNNER_TEMP/footage-native"
      - name: Verify AAC impulse timing (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          node --test packages/electron-host/test/audio-aac-timing.integration.test.cjs 2>&1 | tee "$RUNNER_TEMP/aac-timing.log"
      - name: Upload renderer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: electron-webcodecs-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/electron-portable
            ${{ runner.temp }}/footage-native/verification.json
            ${{ runner.temp }}/footage-native/composed.mp4
            ${{ runner.temp }}/footage-native/report.json
            ${{ runner.temp }}/footage-native/capture-pixels.jsonl
            ${{ runner.temp }}/media-formats
            ${{ runner.temp }}/native-capture/results.json
            ${{ runner.temp }}/native-capture/reference-*.json
            ${{ runner.temp }}/native-capture/segments-*.json
            ${{ runner.temp }}/native-capture/*.mp4
            ${{ runner.temp }}/aac-timing.log
