name: Feature checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: feature-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feature-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Configure temporary build directories (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/velocast-cargo" >> "$GITHUB_ENV"
          echo "TURBO_CACHE_DIR=$RUNNER_TEMP/velocast-turbo-cache" >> "$GITHUB_ENV"
      - name: Configure temporary build directories (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'velocast-cargo')" >> $env:GITHUB_ENV
          "TURBO_CACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'velocast-turbo-cache')" >> $env:GITHUB_ENV
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Electron display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install the pinned Electron runtime
        run: node packages/electron-host/node_modules/electron/install.js
      - name: Configure Electron's Linux sandbox helper
        if: runner.os == 'Linux'
        run: |
          sandbox="$(node -p "require('node:path').join(require('node:path').dirname(require('./packages/electron-host/node_modules/electron')), 'chrome-sandbox')")"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
      - name: Run feature checks with a display (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm check:fast
      - name: Run feature checks (Windows)
        if: runner.os == 'Windows'
        run: pnpm check:fast
