name: Feature checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: feature-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feature-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Configure temporary build directories (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/velocast-cargo" >> "$GITHUB_ENV"
          echo "TURBO_CACHE_DIR=$RUNNER_TEMP/velocast-turbo-cache" >> "$GITHUB_ENV"
      - name: Configure temporary build directories (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'velocast-cargo')" >> $env:GITHUB_ENV
          "TURBO_CACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'velocast-turbo-cache')" >> $env:GITHUB_ENV
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Electron display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install the pinned Electron runtime
        run: node packages/electron-host/node_modules/electron/install.js
      - name: Configure Electron's Linux sandbox helper
        if: runner.os == 'Linux'
        run: |
          sandbox="$(node -p "require('node:path').join(require('node:path').dirname(require('./packages/electron-host/node_modules/electron')), 'chrome-sandbox')")"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
      - name: Run feature checks with a display (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm check:fast
      - name: Run feature checks (Windows)
        if: runner.os == 'Windows'
        run: pnpm check:fast
      - name: Build renderer and CLI for native capture (Windows)
        id: native_capture_build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build -p velocast-renderer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate automatic media selection (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $renderer = Join-Path $env:CARGO_TARGET_DIR 'debug/velocast-renderer.exe'
          $output = Join-Path $env:RUNNER_TEMP 'electron-portable'
          $env:VELOCAST_WEBCODECS_TEST_BINARY = node -p "require('./packages/electron-host/node_modules/electron')"
          node --test packages/electron-host/test/shared-capability-runtime.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-electron-portable.mjs --renderer $renderer --output $output --frames 8 --repeats 1
          exit $LASTEXITCODE
      - name: Validate native 4K DOM capture (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $renderer = Join-Path $env:CARGO_TARGET_DIR 'debug/velocast-renderer.exe'
          $output = Join-Path $env:RUNNER_TEMP 'native-capture'
          $env:VELOCAST_WEBCODECS_TEST_BINARY = node -p "require('./packages/electron-host/node_modules/electron')"
          node --test --test-name-pattern="bitmap CPU compositor" packages/electron-host/test/webcodecs-runtime.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-native-capture.mjs --renderer $renderer --output $output --frames 24 --repeats 3 --mode both --all-frames true
          exit $LASTEXITCODE
      - name: Validate CPU compositor 4K capture (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.native_capture_build.outcome == 'success' }}
        shell: pwsh
        run: |
          $renderer = Join-Path $env:CARGO_TARGET_DIR 'debug/velocast-renderer.exe'
          $output = Join-Path $env:RUNNER_TEMP 'native-capture-cpu'
          node scripts/verify-native-capture.mjs --renderer $renderer --output $output --frames 24 --repeats 3 --mode reference --all-frames true --cpu-compositor true
          exit $LASTEXITCODE
      - name: Save native capture evidence (Windows)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: native-capture-windows
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/electron-portable/results.json
            ${{ runner.temp }}/electron-portable/auto-*.json
            ${{ runner.temp }}/native-capture/results.json
            ${{ runner.temp }}/native-capture/reference-*.json
            ${{ runner.temp }}/native-capture/segments-*.json
            ${{ runner.temp }}/native-capture/*.mp4
            ${{ runner.temp }}/native-capture-cpu/results.json
            ${{ runner.temp }}/native-capture-cpu/reference-*.json
            ${{ runner.temp }}/native-capture-cpu/*.mp4
