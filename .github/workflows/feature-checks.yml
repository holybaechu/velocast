name: Feature checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feature-checks:
    name: Feature checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up the workspace
        uses: ./.github/actions/setup
      - name: Run feature checks (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm check:fast
      - name: Run feature checks (Windows)
        if: runner.os == 'Windows'
        run: pnpm check:fast
      - name: Check the Windows resource profiler
        if: runner.os == 'Windows'
        run: pnpm test:profiling
