name: Set up Velocast
description: Install the workspace toolchains and pinned Electron runtime

inputs:
  rust:
    description: Install Rust with rustfmt and Clippy
    default: "true"

runs:
  using: composite
  steps:
    - name: Configure temporary directories (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        echo "CARGO_TARGET_DIR=$RUNNER_TEMP/velocast-cargo" >> "$GITHUB_ENV"
        echo "TURBO_CACHE_DIR=$RUNNER_TEMP/velocast-turbo-cache" >> "$GITHUB_ENV"
    - name: Configure temporary directories (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'velocast-cargo')" >> $env:GITHUB_ENV
        "TURBO_CACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'velocast-turbo-cache')" >> $env:GITHUB_ENV
    - name: Set up pnpm
      uses: pnpm/action-setup@v6
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    - name: Set up Rust
      if: inputs.rust == 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Install Linux display dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64
    - name: Install workspace dependencies
      shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
      run: pnpm install --frozen-lockfile --ignore-scripts
    - name: Install the pinned Electron runtime
      shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
      run: node packages/electron-host/node_modules/electron/install.js
    - name: Configure the Linux sandbox helper
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sandbox="$(node -p "require('node:path').join(require('node:path').dirname(require('./packages/electron-host/node_modules/electron')), 'chrome-sandbox')")"
        sudo chown root:root "$sandbox"
        sudo chmod 4755 "$sandbox"
