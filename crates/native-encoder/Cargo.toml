[package]
name = "velocast-native-encoder"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
napi = { version = "3", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[target.'cfg(windows)'.dependencies]
ffmpeg-sys-next = { version = "9.0.0", default-features = false, features = ["avcodec", "avformat"] }
windows = { version = "0.62.2", features = ["Win32_Security", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Com"] }
